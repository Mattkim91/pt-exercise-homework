name: 자동 검사
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 자료·번역·문서
        run: node tools/check-data.js
      - name: 화면·인쇄·네트워크
        run: node tools/check-browser.js
